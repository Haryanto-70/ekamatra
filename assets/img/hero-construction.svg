<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3a5c"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#sky)"/>
  <circle cx="980" cy="160" r="90" fill="#ffd27a" opacity="0.85"/>
  <!-- ground -->
  <rect x="0" y="560" width="1200" height="140" fill="#3a3f47"/>
  <rect x="0" y="555" width="1200" height="8" fill="#22262c"/>
  <!-- distant buildings -->
  <g opacity="0.5" fill="#0f2138">
    <rect x="40" y="420" width="60" height="140"/>
    <rect x="120" y="380" width="50" height="180"/>
    <rect x="190" y="450" width="70" height="110"/>
    <rect x="980" y="400" width="60" height="160"/>
    <rect x="1060" y="440" width="50" height="120"/>
    <rect x="1130" y="410" width="55" height="150"/>
  </g>
  <!-- crane -->
  <g stroke="#e8e8e8" stroke-width="6" fill="none">
    <line x1="150" y1="560" x2="150" y2="140"/>
    <line x1="150" y1="140" x2="430" y2="140"/>
    <line x1="150" y1="140" x2="90" y2="190"/>
    <line x1="150" y1="170" x2="380" y2="140"/>
    <line x1="150" y1="200" x2="330" y2="140"/>
    <line x1="380" y1="140" x2="380" y2="260"/>
  </g>
  <circle cx="150" cy="140" r="8" fill="#f5a623"/>
  <!-- excavator body -->
  <g>
    <rect x="560" y="470" width="220" height="90" rx="10" fill="#f5a623"/>
    <rect x="560" y="470" width="220" height="30" rx="8" fill="#e08e12"/>
    <rect x="620" y="410" width="120" height="70" rx="8" fill="#f5a623"/>
    <rect x="620" y="410" width="120" height="18" fill="#e08e12"/>
    <circle cx="660" cy="450" r="10" fill="#22262c"/>
    <rect x="630" y="425" width="45" height="30" rx="4" fill="#bfe3ff"/>
    <!-- arm -->
    <path d="M700 420 L820 340 L790 320" stroke="#3a3f47" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M790 320 L850 380 L900 400" stroke="#3a3f47" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M900 400 L930 440 L900 470 L870 445 Z" fill="#3a3f47"/>
    <!-- tracks -->
    <rect x="555" y="555" width="230" height="30" rx="15" fill="#22262c"/>
    <circle cx="580" cy="570" r="14" fill="#4a4f57"/>
    <circle cx="640" cy="570" r="14" fill="#4a4f57"/>
    <circle cx="700" cy="570" r="14" fill="#4a4f57"/>
    <circle cx="760" cy="570" r="14" fill="#4a4f57"/>
  </g>
  <!-- dump truck silhouette -->
  <g transform="translate(870,430)">
    <rect x="0" y="60" width="220" height="70" rx="8" fill="#1b3a5c"/>
    <rect x="10" y="10" width="90" height="60" rx="6" fill="#274b74"/>
    <rect x="120" y="0" width="100" height="80" rx="6" fill="#274b74"/>
    <circle cx="45" cy="140" r="22" fill="#22262c"/>
    <circle cx="45" cy="140" r="9" fill="#8a8f97"/>
    <circle cx="180" cy="140" r="22" fill="#22262c"/>
    <circle cx="180" cy="140" r="9" fill="#8a8f97"/>
  </g>
</svg>
