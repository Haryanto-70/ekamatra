<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="40" y1="182" x2="160" y2="16">
      <stop offset="0%" stop-color="#c97a0e"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffd27a"/>
    </linearGradient>
    <linearGradient id="navy" gradientUnits="userSpaceOnUse" x1="100" y1="16" x2="100" y2="182">
      <stop offset="0%" stop-color="#1b3a5c"/>
      <stop offset="100%" stop-color="#0f2138"/>
    </linearGradient>
  </defs>

  <!-- badge: pointed top, flat bottom -->
  <path d="M100,16 L155,65 Q160,68 160,75 L160,182 L40,182 L40,75 Q40,68 45,65 Z"
        fill="#ffffff" stroke="url(#navy)" stroke-width="6"/>
  <path d="M100,26 L147,68 Q152,71 152,77 L152,174 L48,174 L48,77 Q48,71 53,68 Z"
        fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.8"/>

  <!-- ground -->
  <line x1="48" y1="178" x2="152" y2="178" stroke="url(#navy)" stroke-width="4" stroke-linecap="round"/>

  <!-- house -->
  <rect x="50" y="148" width="28" height="30" fill="url(#navy)"/>
  <path d="M45,148 L81,148 L64,124 Z" fill="url(#navy)"/>
  <rect x="59" y="160" width="10" height="18" fill="#ffffff"/>

  <!-- building -->
  <rect x="88" y="90" width="30" height="88" fill="url(#navy)"/>
  <g fill="#ffffff">
    <rect x="94" y="100" width="7" height="9"/>
    <rect x="107" y="100" width="7" height="9"/>
    <rect x="94" y="119" width="7" height="9"/>
    <rect x="107" y="119" width="7" height="9"/>
    <rect x="94" y="138" width="7" height="9"/>
    <rect x="107" y="138" width="7" height="9"/>
  </g>

  <!-- crane -->
  <line x1="124" y1="178" x2="124" y2="52" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
  <line x1="64" y1="52" x2="130" y2="52" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
  <line x1="124" y1="52" x2="124" y2="44" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <path d="M124,44 L67,52 M124,44 L129,52" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="52" x2="80" y2="90" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <rect x="72" y="90" width="16" height="13" rx="2" fill="url(#gold)"/>
</svg>
